name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: xcodebuild -project "Token/Token.xcodeproj" -scheme Token -destination 'platform=macOS' build

      - name: Test
        run: xcodebuild -project "Token/Token.xcodeproj" -scheme Token -destination 'platform=macOS' test
