name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build
        run: xcodebuild -project "Token/Token.xcodeproj" -scheme Token -destination 'platform=macOS' build

      - name: Test
        run: xcodebuild -project "Token/Token.xcodeproj" -scheme Token -destination 'platform=macOS' test
